# ---------------------------------------------------------------------------
# Traffic Monitoring – Livestream Pipeline
#
# Services:
#   kafka            – KRaft-mode Kafka (confluentinc/cp-kafka 7.6.0, NO Zookeeper)
#   kafka-init       – One-shot topic creator
#   tracking-papagou – CV detection + speed from I/C Papagou (cam231)
#   tracking-roupaki – CV detection + speed from Roupaki Toll Station (cam88)
#   spark-analytics  – PySpark Structured Streaming: Q1-Q3, Q5-Q6
#   spark-alerts     – Lightweight kafka-python consumer (Q4: >130 km/h)
#   dashboard        – Live video, logs and records per camera (http://localhost:8090)
#   tunnel           – Optional public URL for the dashboard (Cloudflare Quick Tunnel);
#                      starts only with: docker compose --profile public up
#   tunnel-domain    – Optional fixed URL on your own domain (named Cloudflare Tunnel);
#                      starts only with: docker compose --profile domain up
#
# KRaft mode eliminates Zookeeper entirely — no more session-timeout crashes.
# Data persisted to shared SQLite at /data/db/traffic.db (volume: db-data);
# records older than RETENTION_DAYS (default 7) are deleted hourly.
# ---------------------------------------------------------------------------

# Rotate container logs — the dashboard shows them, and they grow without bound
# on a pipeline that runs for days
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  traffic-net:
    driver: bridge

volumes:
  db-data:     # shared SQLite database volume
  frames-data: # latest annotated frame per camera, streamed by the dashboard

services:

  # ── Kafka — KRaft mode (no Zookeeper) ──────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    logging: *default-logging
    networks: [traffic-net]
    ports:
      - "9092:9092"   # host access for debugging
    environment:
      # ── KRaft identity ────────────────────────────────────────────────────
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # ── Listeners ─────────────────────────────────────────────────────────
      #   PLAINTEXT      → internal docker traffic  (port 29092)
      #   CONTROLLER     → KRaft controller         (port 9093)
      #   PLAINTEXT_HOST → host-machine access       (port 9092)
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # ── Broker settings ───────────────────────────────────────────────────
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24

      # ── KRaft requires a stable cluster ID ───────────────────────────────
      # Generate once with:  kafka-storage random-uuid
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 45s

  # ── Topic Initialiser (one-shot) ────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    logging: *default-logging
    networks: [traffic-net]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic traffic-stats   --partitions 8  --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic traffic-alerts  --partitions 2  --replication-factor 1 &&
       echo '=== Topics ready ===' &&
       kafka-topics --bootstrap-server kafka:29092 --list"
    restart: "no"

  # ── Tracking: I/C Papagou (Imittos Ring Road) — cam231 ─────────────────────
  tracking-papagou:
    build:
      context: .
      dockerfile: Tracking/Dockerfile
    container_name: tracking-papagou
    logging: *default-logging
    networks: [traffic-net]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - db-data:/data/db
      - frames-data:/data/frames
    environment:
      INPUT_VIDEO: "cam231"
      CAMERA_NAME: "IC_Papagou"
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC_STATS: traffic-stats
      KAFKA_TOPIC_ALERTS: traffic-alerts
      ALERT_SPEED_KMH: "130"
      DB_PATH: "/data/db/traffic.db"
      RETENTION_DAYS: "${RETENTION_DAYS:-7}"
      FRAME_DIR: "/data/frames"
      # ── Geometry (pixels on the 1920×1080 stream → road metres; see Notes/CALIBRATION.md)
      #    The two carriageways diverge here, so each has its own ground-plane fit.
      LANE_LEFT_LABEL: "to_Katechaki"
      ROI_L: "74,944;436,933;919,700;696,710"
      CALIB_L: "73.8,943.7=0,0;435.6,933.1=11.7,0;918.8,699.9=11.7,48;696.1,710.3=0,48"
      TRIPWIRES_L: "6,42"
      LANE_RIGHT_LABEL: "to_Mesogeia_Vrilissia"
      ROI_R: "474,1089;1152,938;1262,706;954,747"
      CALIB_R: "474.4,1088.6=0,0;1152.3,937.7=15.5,0;1262.3,706.0=15.5,42;954.5,746.6=0,42"
      TRIPWIRES_R: "8,38"
    command: ["python", "-u", "monitor_traffic.py"]
    restart: unless-stopped

  # ── Tracking: Roupaki Toll Station — cam88 ──────────────────────────────────
  tracking-roupaki:
    build:
      context: .
      dockerfile: Tracking/Dockerfile
    container_name: tracking-roupaki
    logging: *default-logging
    networks: [traffic-net]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - db-data:/data/db
      - frames-data:/data/frames
    environment:
      INPUT_VIDEO: "cam88"
      CAMERA_NAME: "Roupaki_Toll_Station"
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC_STATS: traffic-stats
      KAFKA_TOPIC_ALERTS: traffic-alerts
      ALERT_SPEED_KMH: "130"
      DB_PATH: "/data/db/traffic.db"
      RETENTION_DAYS: "${RETENTION_DAYS:-7}"
      FRAME_DIR: "/data/frames"
      # ── Geometry (pixels on the 1920×1080 stream → road metres; see Notes/CALIBRATION.md)
      #    One ground-plane fit covers both carriageways; the right zone stops
      #    before the toll-plaza approach, where the lanes fan out.
      LANE_LEFT_LABEL: "to_Elefsina"
      ROI_L: "-126,979;210,996;695,676;523,680"
      CALIB_L: "-126.2,978.7=0,0;210.1,995.7=11.7,0;694.8,675.8=11.7,64;523.1,680.1=0,64"
      TRIPWIRES_L: "8,56"
      LANE_RIGHT_LABEL: "to_Athens_Airport"
      ROI_R: "216,1207;802,1266;1046,791;672,791"
      CALIB_R: "150.3,1199.9=0,0;715.9,1257.6=11.5,0;914.6,790.6=11.5,40;638.0,790.6=0,40"
      TRIPWIRES_R: "13,32"
    command: ["python", "-u", "monitor_traffic.py"]
    restart: unless-stopped

  # ── Spark Analytics — local[*] mode (Q1-Q3, Q5, Q6) ─────────────────────────
  spark-analytics:
    build:
      context: .
      dockerfile: Spark/Dockerfile
    container_name: spark-analytics
    logging: *default-logging
    networks: [traffic-net]
    restart: on-failure
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC_STATS: traffic-stats
      SPARK_MASTER: "local[*]"
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - /app/analytics.py

  # ── Real-Time Alerts Consumer (Q4: >130 km/h) ───────────────────────────────
  spark-alerts:
    build:
      context: .
      dockerfile: Spark/Dockerfile
    container_name: spark-alerts
    logging: *default-logging
    networks: [traffic-net]
    # The image defaults to the non-root spark user, which can't write to the
    # root-owned SQLite volume; this consumer is the only writer of speed_alerts
    user: root
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - db-data:/data/db
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC_ALERTS: traffic-alerts
      ALERT_SPEED_KMH: "130"
      DB_PATH: "/data/db/traffic.db"
      RETENTION_DAYS: "${RETENTION_DAYS:-7}"
    command: ["python3", "/app/alerts_consumer.py"]
    restart: unless-stopped

  # ── Dashboard — live video, logs and records per camera ─────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dashboard/Dockerfile
    container_name: dashboard
    logging: *default-logging
    networks: [traffic-net]
    ports:
      # Localhost only: the container can reach the Docker socket
      - "127.0.0.1:8090:8000"
    volumes:
      - db-data:/data/db
      - frames-data:/data/frames:ro
      # Read container logs and status (docker logs / docker ps)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # CAMERA_NAME=container for every tracking service to show
      CAMERAS: "IC_Papagou=tracking-papagou,Roupaki_Toll_Station=tracking-roupaki"
      DB_PATH: "/data/db/traffic.db"
      FRAME_DIR: "/data/frames"
      ALERT_SPEED_KMH: "130"
    restart: unless-stopped

  # ── Public URL — Cloudflare Quick Tunnel (opt-in) ───────────────────────────
  #    docker compose --profile public up -d    then the URL is in: docker logs tunnel
  #    Visitors sign in with a one-time PIN sent to an address in ALLOWED_MAIL
  #    (comma-separated; "*@domain" allows a whole domain). No Cloudflare account
  #    is needed, but the URL changes every time this container restarts.
  tunnel:
    image: cloudflare/cloudflared:2026.10.1
    container_name: tunnel
    logging: *default-logging
    profiles: [public]
    networks: [traffic-net]
    depends_on: [dashboard]
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://dashboard:8000
      - --allowed-mail
      - "${ALLOWED_MAIL:-*@aueb.gr}"
    restart: unless-stopped

  # ── Public URL on your own domain — named Cloudflare Tunnel (opt-in) ────────
  #    Create the tunnel in the Cloudflare dashboard with a published application
  #    route to http://dashboard:8000, put its token in .env as TUNNEL_TOKEN, then:
  #    docker compose --profile domain up -d
  #    The hostname and any login (Cloudflare Access) are set in the dashboard.
  tunnel-domain:
    image: cloudflare/cloudflared:2026.10.1
    container_name: tunnel-domain
    logging: *default-logging
    profiles: [domain]
    networks: [traffic-net]
    depends_on: [dashboard]
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped
